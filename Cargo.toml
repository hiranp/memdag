[package]
name = "memdag"
version = "0.3.0"
edition = "2024"
authors = ["Hiran Patel"]
description = "Local-first relational DAG and FTS5 memory engine with sqlite-vec for AI coding harnesses"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hiranp/memdag"
keywords = ["memory", "dag", "sqlite", "fts5", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "vtab"] }
sqlite-vec = "=0.1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
anyhow = "1.0"
directories = "6.0"
jsonc-parser = { version = "0.34", features = ["cst"] }
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3.17"

# Build speed/size (numbers in docs/adr/0002-build-profile-and-low-load-builds.md).
# Line tables keep backtraces and panics readable; full variable debuginfo is rarely used
# here and dominates link time and target/ size. Dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
