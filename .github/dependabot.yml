# Every Dependabot PR costs a full CI run, and each rebase costs another, so
# version updates are monthly and grouped into one PR per ecosystem.
# Security updates are not affected: they still arrive at once, one per alert.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
